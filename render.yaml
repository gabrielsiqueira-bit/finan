services:
  - type: web
    name: controle-financas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false          # cole aqui a string de conexão do Postgres
      - key: SECRET_KEY
        generateValue: true
