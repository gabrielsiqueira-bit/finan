{% extends "base.html" %}
{% block content %}
<section class="card">
  <form method="post" action="{{ url_for('cartao_novo') }}" class="grade-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome do cartão<input name="nome" required maxlength="60"></label>
    <label>Limite (R$)<input name="limite" required inputmode="decimal" placeholder="0,00"></label>
    <label>Dia de fechamento<input type="number" name="fechamento" min="1" max="31" required></label>
    <label>Dia de vencimento<input type="number" name="vencimento" min="1" max="31" required></label>
    <div class="acoes">
      <button class="btn azul" type="submit">+ Adicionar cartão</button>
      <button class="btn rosa" type="submit" form="f-remover">Remover seleção</button>
      <a class="btn cinza" href="{{ url_for('cartoes') }}">Voltar</a>
    </div>
  </form>
</section>

<section class="card tabela-box">
  <form id="f-remover" method="post" action="{{ url_for('cartao_remover') }}"
        data-confirm="Remover o cartão também apaga TODAS as compras dele. Deseja continuar?"
        data-exige-selecao="Selecione um ou mais cartões para remover.">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="rolagem">
    <table>
      <thead>
        <tr>
          <th class="chk"><input type="checkbox" data-select-all aria-label="Selecionar todos"></th>
          <th>CARTÃO</th><th class="dir">LIMITE</th><th class="centro">FECHAMENTO</th><th class="centro">VENCIMENTO</th>
        </tr>
      </thead>
      <tbody>
        {% for c in cartoes %}
        <tr>
          <td class="chk"><input type="checkbox" name="ids" value="{{ c.id }}"></td>
          <td>{{ c.nome }}</td>
          <td class="dir">{{ c.limite|moeda }}</td>
          <td class="centro">dia {{ c.fechamento }}</td>
          <td class="centro">dia {{ c.vencimento }}</td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="vazio">Nenhum cartão cadastrado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
  </form>
</section>
{% endblock %}
